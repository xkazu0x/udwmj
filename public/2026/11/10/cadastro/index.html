<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de Usuário">
    <meta name="author" content="Ruan Carlos Lins Mendes">
    <title>Atividade 10-11</title>
</head>
<body>
    <h1>Cadastro</h1>

    <form>
        <input id="nome" type="text" placeholder="Nome" pattern="[A-Za-z\s]+$" title="Digite apenas letras" maxlength="255" required>
        <span id="nome_err"></span>
        <br><br>

        <input id="email" type="text" placeholder="exemplo@email.com" pattern="[A-Za-z0-9.]+@[A-Za-z.]+" title="Digite seu e-mail" maxlength="255" required>
        <span id="email_err"></span>
        <br><br>

        <input id="telefone" type="tel" name="telefone" placeholder="11222223333" pattern="[0-9]{2}[0-9]{5}[0-9]{4}" title="Digite apenas números">
        <span id="telefone_err"></span>
        <br><br>

        <input id="usuario" type="text" placeholder="Nome de usuário" pattern="[A-Za-z0-9]+$" title="Digite apenas letras e números" min="4" max="32" required>
        <span id="usuario_err"></span>
        <br><br>

        <input id="senha0" type="password" placeholder="Senha" pattern=".{8,}" title="Digite 8 ou mais caracteres" required>
        <span id="senha0_err"></span>
        <br><br>

        <input id="senha1" type="password" placheholder="Confirmação de Senha" pattern=".{8,}" title="Digite a sua senha novamente" required>
        <span id="senha1_err"></span>
        <br><br>

        <input id="botao" type="button" value="Cadastrar" onclick="validar();">
    </form>

    <script src="/script.js"></script>
</body>
</html>
